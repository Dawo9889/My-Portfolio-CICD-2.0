name: Deploy to Production (orchestrator)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml

  terraform:
    uses: ./.github/workflows/reusable-tofu.yml

  deploy:
    needs: [build, terraform]
    uses: ./.github/workflows/reusable-ansible.yml
    with:
      image: ${{ needs.build.outputs.image }}
    secrets: inherit