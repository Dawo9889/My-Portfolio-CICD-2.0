name: Reusable Build

on:
  workflow_call:
    outputs:
      image:
        description: 'Docker image tag'
        value: ${{ steps.set_image.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.set_image.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/dawo9889/my-portfolio-cicd-2.0:latest
            ghcr.io/dawo9889/my-portfolio-cicd-2.0:${{ github.sha }}

      - name: Set output image
        id: set_image
        run: |
          echo "image=ghcr.io/dawo9889/my-portfolio-cicd-2.0:${{ github.sha }}" >> $GITHUB_OUTPUT


