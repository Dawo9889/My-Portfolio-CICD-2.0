name: test Infisical integration
on:
  workflow_dispatch:

jobs:
  test-infisical:
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
    steps:

      - name: Debug OIDC Claims
        uses: steve-todorov/oidc-debugger-action@v1
        with:
          audience: '${{ github.server_url }}/${{ github.repository }}'

      - uses: Infisical/secrets-action@v1.0.7
        with:
          domain: "https://infisical.dawo9889-homelab.ovh"
          method: "oidc"
          env-slug: "dev"
          project-slug: "portfolio-cicd-l1g-g"
          identity-id: "e2c4d1b8-7a5d-4fed-96c9-a3a71369cf4c"
          secret-path: "/private_keys"
      - name: Run SSH command
        env:
          SSH_KEY: ${{ env.PORTFOLIO_CICD_SSH_KEY }}
        run: |
          printf "%s\n" "${{ env.PORTFOLIO_CICD_SSH_KEY }}" > ~/.ssh/private_key.pem
          chmod 600 private_key.pem
          ssh -i private_key.pem -o StrictHostKeyChecking=no ubuntu@192.168.1.16 'ip a'